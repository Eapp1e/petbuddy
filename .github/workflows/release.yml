name: Release

# 打 tag（如 v0.2.0）时自动构建 Windows 安装包/便携版并挂到 Release。
# latest.yml 必须一起上传，客户端的"检查更新"才有东西可看。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (nsis + portable)
        run: npm run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/PetBuddy-Setup-*.exe
            release/PetBuddy-*-portable.exe
            release/latest.yml
            release/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
