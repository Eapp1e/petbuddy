name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 只装依赖不跑脚本：Electron 的 postinstall 会去下载运行时，CI 里用不上
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
